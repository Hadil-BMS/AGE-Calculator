<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Age calculator</title>
</head>
<body>
  <div class="container">
    <div class="age-container">
      <div class="full-date-container">
        <div class="day-container">
          <p class="label">day</p>
          <input type="text" placeholder="DD" id="day-input">
          <p class="error-message">Must be a valid day</p>
        </div>
        <div class="month-container">
          <p class="label">month</p>
          <input type="text" placeholder="MM" id="month-input">
          <p class="error-message">Must be a valid month</p>
        </div>
        <div class="year-container">
          <p class="label">year</p>
          <input type="text" placeholder="YYYY" id="year-input">
          <p class="error-message">Must in the past</p>
        </div>
      </div>
      <div class="btn">
        <hr class="hr"> 
        <img src="img/icon-arrow.svg" alt="" class="btn-img">
      </div>
      <div class="result-container">
        <div class="years">
          <h2 id="year-re">--</h2>
          <h2 >years</h2>
        </div>
        <div class="months">
          <h2 id="month-re">--</h2>
          <h2>months</h2>
        </div>
        <div class="days">
          <h2 id="day-re">--</h2>
          <h2>days</h2>
        </div>
      </div>
    </div>
  </div>




  <script src="js.js"></script>
</body>
</html>
